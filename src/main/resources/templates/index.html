<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise Search</title>
    <script src="/script.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Raleway:wght@700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        body {
          margin: 0;
          padding: 0;
          font-family: 'Inter', sans-serif;
          background:url("/images/bruised-banana.webp") repeat;
          background-size: 500px auto;
          color: #333;
          display: flex;
          justify-content: center;
          align-items: flex-start;
          min-height: 100vh;
          padding: 2rem;
        }

        .container {
          max-width: 700px;
          width: 100%;
          background: white;
          border-radius: 1rem;
          box-shadow: 0 8px 20px rgba(0,0,0,0.1);
          padding: 2.5rem;
          border: 1px solid #ddd;
        }

        h2 {
              margin-top: 0;
              font-family: 'Rubik Mono One', sans-serif;
              font-weight: 400;
              font-size: 2.2rem;
              text-align: center;
              color: #d85d28;
              letter-spacing: 2px;
            }

        .tagline {
          text-align: center;
          color: #555;
          font-family: 'Space Mono', monospace;
          font-size: 1rem;
          margin-top: -0.5rem;
          margin-bottom: 1.5rem;
        }

        .input-group {
          display: flex;
          flex-direction: column;
          gap: 1.2rem;
          margin-bottom: 2rem;
        }

        .search-input,
        select,
        input[list] {
          display: block;
          box-sizing: border-box;
          width: 100%;
          font-size: 1rem;
          font-family: 'Space Mono', monospace;
          padding: 0.85rem;
          border: 1px solid #ccc;
          border-radius: 0.5rem;
          background: #f9f7f3;
          appearance: none;
          -webkit-appearance: none;
          -moz-appearance: none;
          transition: border 0.2s, box-shadow 0.2s;
        }


        .search-input:focus,
        select:focus,
        input[list]:focus {
          border-color: #d85d28;
          box-shadow: 0 0 0 3px rgba(216,93,40,0.2);
          outline: none;
        }

        .button-group {
          display: flex;
          gap: 1rem;
          justify-content: center;
          flex-wrap: wrap;
        }

        button {
          padding: 0.75rem 1.75rem;
          font-size: 1rem;
          border: none;
          border-radius: 2rem;
          cursor: pointer;
          transition: background 0.2s, transform 0.2s;
          font-family: 'Space Mono', monospace;
        }

        #searchButton {
          background-color: #4a7c7c;
          color: white;
        }

        #searchButton:hover {
          background-color: #3b6363;
          transform: translateY(-2px);
        }

        #searchButtonAi {
          background-color: #d85d28;
          color: white;
        }

        #searchButtonAi:hover {
          background-color: #b84f23;
          transform: translateY(-2px);
        }

        .exercise {
          margin-top: 2rem;
          border-top: 1px dashed #ccc;
          padding-top: 1.5rem;
        }

        .refresh-btn {
          transition: background 0.2s;
        }
        .refresh-btn:hover {
          background-color: #e0e0e0;
        }

        .modal-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: rgba(0,0,0,0.4);
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 999;
        }

        .modal-form {
          background-color: #fff;
          padding: 2rem;
          border-radius: 12px;
          box-shadow: 0 8px 30px rgba(0,0,0,0.25);
          width: 90%;
          max-width: 500px;
          font-family: 'Space Mono', monospace;
        }

        .modal-form h4 {
          margin-top: 0;
          font-size: 1.25rem;
          margin-bottom: 1rem;
        }

        .modal-form select,
        .modal-form input {
          width: 100%;
          padding: 0.75rem;
          margin-bottom: 1rem;
          border: 1px solid #ccc;
          border-radius: 6px;
          font-size: 1rem;
          box-sizing: border-box;
        }

        .modal-form button {
          margin-top: 0.5rem;
          padding: 0.6rem 1.2rem;
          font-size: 1rem;
          cursor: pointer;
          border: none;
          border-radius: 6px;
          background-color: #4a7c7c;
          color: #fff;
          transition: background 0.2s;
        }

        .modal-form button:hover {
          background-color: #3b6363;
        }

        .carousel {
              position: relative;
            }
            .slide {
              display: none;
              animation: fade 0.3s ease;
            }
            #slide1:checked ~ .carousel .slide:nth-child(1),
            #slide2:checked ~ .carousel .slide:nth-child(2) {
              display: block;
            }
            .carousel-dots {
              text-align: center;
              margin-top: 1rem;
            }
            .carousel-dots label {
              display: inline-block;
              width: 10px;
              height: 10px;
              margin: 0 6px;
              border-radius: 50%;
              background: #ccc;
              cursor: pointer;
            }
            #slide1:checked ~ .carousel-dots label[for="slide1"],
            #slide2:checked ~ .carousel-dots label[for="slide2"] {
              background: #4a7c7c;
            }
            @keyframes fade {
              from { opacity:0; }
              to { opacity:1; }
            }
    </style>
</head>
<body>
<div class="container">
    <h2>PSYBA</h2>

    <!-- Radio toggles -->
    <input type="radio" name="carousel" id="slide1" checked hidden>
    <input type="radio" name="carousel" id="slide2" hidden>

    <!-- Carousel slides -->
    <div class="carousel">
        <div class="slide">
            <div class="input-group">
                <input list="muscleGroupCombo" id="muscleGroupInput" placeholder="Describe your goal">
                <datalist id="muscleGroupCombo">
                    <option value="Full Upper Body">
                    <option value="Push Day">
                    <option value="Pull Day">
                    <option value="Complete Legs">
                    <option value="Upper Legs">
                    <option value="Upper Front">
                    <option value="Upper Back & Arms">
                    <option value="Shoulder Focus">
                    <option value="Core Strength">
                    <option value="Complete Arms">
                </datalist>
                <select id="aiSearchLevel">
                    <option value="" selected>Select difficulty</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>
            <div class="button-group">
                <button id="searchButtonAi">Generate Plan</button>
            </div>
        </div>
        <div class="slide">
            <div class="input-group">
                <select id="searchInputMuscle">
                    <option value="" selected>Select target muscle</option>
                    <option value="CHEST">Chest</option>
                    <option value="TRAPS">Traps</option>
                    <option value="LATS">Lats</option>
                    <option value="NECK">Neck</option>
                    <option value="MIDDLE_BACK">Mid Back</option>
                    <option value="LOWER_BACK">Lower Back</option>
                    <option value="QUADRICEPS">Quads</option>
                    <option value="HAMSTRINGS">Hamstrings</option>
                    <option value="ADDUCTORS">Adductors</option>
                    <option value="ABDUCTORS">Abductors</option>
                    <option value="CALVES">Calves</option>
                    <option value="BICEPS">Biceps</option>
                    <option value="TRICEPS">Triceps</option>
                    <option value="FOREARMS">Forearms</option>
                    <option value="SHOULDERS">Shoulders</option>
                    <option value="ABDOMINALS">Abs</option>
                </select>
                <select id="searchLevel">
                    <option value="" selected>Select difficulty</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>
            <div class="button-group">
                <button id="searchButton">Search</button>
            </div>
        </div>
    </div>

    <!-- Dots navigation -->
    <div class="carousel-dots">
        <label for="slide1"></label>
        <label for="slide2"></label>
    </div>

    <div id="results"></div>
    <div id="loader" style="display:none;">
        <div class="spinner"></div>
        <p>Loading AI results...</p>
    </div>
    <div id="error" style="display:none;"></div>
</div>

<div id="demoModal" style="
  display: none;
  position: fixed;
  z-index: 9999;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: rgba(0,0,0,0.6);
  align-items: center;
  justify-content: center;
">
    <div style="
    background: white;
    padding: 1rem;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
    max-width: 90%;
    max-height: 80%;
    position: relative;
  ">
        <button id="closeModalBtn" style="
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    ">×</button>
        <img id="demoModalImage" src="" alt="Exercise Demo" style="max-width: 100%; max-height: 70vh;" />
    </div>
</div>
</body>
</html>
